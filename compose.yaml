services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-birbguessr}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-birbguessr}
      POSTGRES_DB: ${DATABASE_NAME:-birbguessr_development}
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-birbguessr}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
