# PostgreSQL. Connection details come from .env (see .env.example); in production
# they come from the deploy environment.
#
# Development and test mirror production's multi-database layout so Solid Queue and
# Solid Cache behave the same in every environment.
default: &default
  adapter: postgresql
  encoding: unicode
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5433) %>
  username: <%= ENV.fetch("DATABASE_USER", "birbguessr") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "birbguessr") %>

development:
  primary:
    <<: *default
    database: birbguessr_development
  queue:
    <<: *default
    database: birbguessr_development_queue
    migrations_paths: db/queue_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *default
    database: birbguessr_test
  queue:
    <<: *default
    database: birbguessr_test_queue
    migrations_paths: db/queue_migrate

# Development and test use :memory_store / :null_store for caching and the async
# Action Cable adapter, so they need only the primary and queue databases.
production:
  primary: &primary_production
    <<: *default
    database: birbguessr_production
    username: birbguessr
    password: <%= ENV["BIRBGUESSR_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: birbguessr_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: birbguessr_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: birbguessr_production_cable
    migrations_paths: db/cable_migrate
